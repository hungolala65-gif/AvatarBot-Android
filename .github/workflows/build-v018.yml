name: Build AvatarBot Android v0.18 Farm Parity

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/v0.18.patch.zlib.b64'
      - '.github/workflows/build-v018.yml'

permissions:
  contents: read

jobs:
  build-v018-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Apply validated v0.18 patch to original v0.17 sources
        shell: bash
        run: |
          set -euo pipefail
          test -s AvatarBot_Android_Native_v0.17_AuthGuard_Source.zip
          unzip -t AvatarBot_Android_Native_v0.17_AuthGuard_Source.zip | tail -1
          mkdir -p extracted
          unzip -q AvatarBot_Android_Native_v0.17_AuthGuard_Source.zip -d extracted
          python3 - <<'PY'
          import base64,zlib,pathlib
          packed=pathlib.Path('patches/v0.18.patch.zlib.b64').read_text().strip()
          result=zlib.decompress(base64.b64decode(packed,validate=True))
          pathlib.Path('v018.patch').write_bytes(result)
          PY
          (cd extracted && patch -p1 --fuzz=0 < ../v018.patch)
          grep -F 'versionName = "0.18.0"' extracted/android/app/build.gradle.kts
          grep -F 'FarmTradingV18Test.java' extracted/tools/verify_legacy.sh
      - name: Offline JAR and per-account settings tests
        working-directory: extracted
        shell: bash
        run: |
          set -euo pipefail
          bash tools/verify_legacy.sh
          bash tools/verify_setup_options_v15.sh
          (cd go-mobilecore && go test ./... && go vet ./...)
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gradle unit tests + debug APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee ../../gradle-build-v018.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK=extracted/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          (cd "$(dirname "$APK")" && sha256sum app-debug.apk > app-debug.apk.sha256)
          mkdir -p outputs
          cp "$APK" outputs/AvatarBot-Android-v0.18-debug.apk
          cp "${APK}.sha256" outputs/AvatarBot-Android-v0.18-debug.apk.sha256 || true
          (cd extracted && zip -qr ../outputs/AvatarBot-Android-v0.18-Source.zip . -x 'android/.gradle/*' 'android/app/build/*' 'android/build/*' '*/.gradle/*')
          sha256sum outputs/AvatarBot-Android-v0.18-debug.apk outputs/AvatarBot-Android-v0.18-Source.zip > outputs/CHECKSUMS.sha256
      - name: Upload failed compilation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: avatarbot-v018-failed-build-log
          path: gradle-build-v018.log
          if-no-files-found: ignore
      - name: Upload v0.18 debug APK and full patched sources
        uses: actions/upload-artifact@v4
        with:
          name: avatarbot-v018-debug-and-source
          path: outputs/*
          if-no-files-found: error
          retention-days: 14
